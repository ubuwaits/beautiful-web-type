description: |-
  Fraunces originated as an inquiry into the idiosyncratic, fleshy Old Style faces of the late nineteenth and early twentieth centuries—an eclectic genre represented by types like Windsor, Souvenir, and early Cooper variants. Commissioned by Google Fonts and drafted by Phaedra Charles and Flavia Zimbardi of Undercase Type, the family was released in 2020 under the SIL Open Font License. Charles and Zimbardi sought to re-examine this warm, vernacular tradition not as a museum facsimile, but through the mechanics of a contemporary variable font engine, offering an expressive, tactile alternative to the prevailing minimalism of digital screens.

  The anatomy of the face is shaped by soft contours, relaxed proportions, and distinct teardrop terminals. Departing from the severe vertical axis of modern Didones or the clinical uniformity of neo-grotesques, Fraunces leans into a supple, hand-drawn cadence. The strokes carry moderate-to-high modulation depending on optical scale, supported by cupped, softly bracketed serifs that anchor the letterforms to the baseline. Terminals on glyphs such as <em>c</em>, <em>r</em>, and <em>f</em> swell into rounded drops, while counters remain spacious and hospitable to ambient light. In composition, this physical buoyancy establishes an animated, approachable texture across the measure, avoiding the mechanical rigidity often associated with industrialized text types.

  What distinguishes Fraunces technically is its multidimensional parametric framework. Alongside continuous axes for weight and optical size, Charles and Zimbardi engineered dedicated controls for <em>Softness</em> and <em>Wonk</em>. The Softness axis governs stroke junctions, shifting the rendering from crisp, chiseled intersections to fluid, continuous contours. The Wonk axis introduces calculated optical quirks—tilting stems slightly off-axis, adjusting individual character weights, and altering serif geometry to evoke the physical irregularities of early foundry metal. Across lower optical sizes, the design stabilizes into a dependable text face with reinforced hairlines and wider apertures; at larger display grades, the contrast sharpens to emphasize its sculptural curves. Its companion italic operates as a true cursive hand, rolling forward with dynamic entry and exit strokes that introduce clear vocal contrast alongside the upright roman.

  Fraunces divides its utility cleanly across scales. In its heavier, characterful display settings, it finds a natural home on packaging, book jackets, cultural publications, and editorial mastheads, where its vintage warmth can set a deliberate tone. In smaller text cuts, with the Wonk parameter dialed back, it behaves with measured discipline across short-to-medium editorial passages. Within the open-source catalog, it remains a thoughtful study in parametric revival, demonstrating how the eccentricities of pre-digital advertising type can be methodically adapted to modern screen environments.
